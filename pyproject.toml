[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daytrading-bot"
version = "0.1.0"
description = "Daytrading-Signal-Bot: Kauf- und Verkaufs-Vorschläge im 5-Minuten-Raster per Telegram"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "python-telegram-bot[job-queue]>=22.0,<23",
    "yfinance>=0.2.54",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
daytrading-bot = "daytrading_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
